# Explicit local runtime only. Run reviewed migration via the guarded test harness first.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
spring.datasource.url=${SIS_JDBC_URL}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=false
slice-a.enabled=true
sis.units.service-keys.ctsv=${SIS_SERVICE_KEY}
sis.units.service-resources.ctsv=units
